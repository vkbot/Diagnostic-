
name: Extract archives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract archives
        run: |
          find . -type f \( \
            -iname "*.zip" -o \
            -iname "*.tar" -o \
            -iname "*.tar.gz" -o \
            -iname "*.tgz" -o \
            -iname "*.tar.bz2" -o \
            -iname "*.tar.xz" -o \
            -iname "*.7z" -o \
            -iname "*.rar" \
          \) -not -path "./.git/*" | while read -r archive; do

            filename=$(basename "$archive")
            dirname=$(dirname "$archive")

            folder="$filename"
            folder="${folder%.tar.gz}"
            folder="${folder%.tar.bz2}"
            folder="${folder%.tar.xz}"
            folder="${folder%.tgz}"
            folder="${folder%.*}"

            target="$dirname/$folder"

            mkdir -p "$target"

            echo "Extracting: $archive -> $target"

            7z x "$archive" "-o$target" -y

          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract archives"
            git push
          else
            echo "Nothing to commit"
          fi
          
