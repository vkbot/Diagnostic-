name: Build other project (debug)

# Сборка любого Android-проекта из корня репозитория через Gradle wrapper.
# Собирается debug-вариант: Android подписывает его отладочным ключом автоматически,
# поэтому APK ставится на телефон без дополнительной подписи.
# Если в корне лежит архив PROJECT_*.zip, он распаковывается.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Unpack project zip (if present)
        run: |
          shopt -s nullglob
          for z in PROJECT_*.zip; do unzip -o -q "$z"; done
          ls -la

      - name: Check Gradle wrapper
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "Gradle wrapper не найден в репозитории (нужны gradlew и gradle/wrapper/)"
            exit 1
          fi
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then SDK_MANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1); fi
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK files
        run: |
          mkdir -p apk-out
          find . -path '*/build/outputs/apk/debug/*.apk' -not -path './apk-out/*' -exec cp {} apk-out/ \;
          ls -la apk-out
          test -n "$(ls -A apk-out)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: project-debug
          path: apk-out/*.apk
