name: Build and sign (all zips except AutoPilot)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then SDK_MANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1); fi
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download AOSP platform test key
        run: |
          BASE=https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security
          mkdir -p "$RUNNER_TEMP/keys"
          curl -fsSL "$BASE/platform.pk8" -o "$RUNNER_TEMP/keys/platform.pk8"
          curl -fsSL "$BASE/platform.x509.pem" -o "$RUNNER_TEMP/keys/platform.x509.pem"
          FP=$(openssl x509 -in "$RUNNER_TEMP/keys/platform.x509.pem" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
          echo "Fingerprint: $FP"
          test "$FP" = "c8a2e9bccf597c2fb6dc66bee293fc13f2fc47ec77bc6b2b0d52c11f51192ab8"

      - name: Build and sign every project
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          FAILED=""
          shopt -s nullglob nocaseglob
          for ZIP in "$GITHUB_WORKSPACE"/*.zip; do
            NAME=$(basename "$ZIP" .zip)
            echo "=== $NAME ==="
            # AutoPilot не собираем вообще
            if echo "$NAME" | grep -qi "autopilot"; then echo "пропуск: AutoPilot"; continue; fi
            (
              set -e
              DIR="$RUNNER_TEMP/src/$NAME"
              rm -rf "$DIR" && mkdir -p "$DIR" && unzip -q "$ZIP" -d "$DIR"
              cd "$DIR"
              # если архив с вложенной папкой, поднимаем её содержимое
              if [ ! -f app/src/main/AndroidManifest.xml ]; then
                INNER=$(find . -maxdepth 2 -name AndroidManifest.xml -path '*/app/src/main/*' | head -n 1)
                if [ -z "$INNER" ]; then echo "не Android-проект, пропуск"; exit 0; fi
                cd "$(dirname "$INNER")/../../.."
              fi
              if grep -qE "omoda\.autopilot|com\.github\.uiautomator" app/build.gradle.kts app/src/main/AndroidManifest.xml 2>/dev/null; then
                echo "пакет AutoPilot, пропуск"; exit 0
              fi
              VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "0")
              gradle assembleRelease --no-daemon
              APK="$OUT/${NAME}-v${VERSION}-signed.apk"
              "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
              "$BT/apksigner" sign --key "$RUNNER_TEMP/keys/platform.pk8" \
                --cert "$RUNNER_TEMP/keys/platform.x509.pem" --out "$APK" "$RUNNER_TEMP/aligned.apk"
              "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/verify.txt"
              grep -qi "c8a2e9bccf597c2fb6dc66bee293fc13f2fc47ec77bc6b2b0d52c11f51192ab8" "$RUNNER_TEMP/verify.txt"
              echo "готово: $(basename "$APK")"
            ) || FAILED="$FAILED $NAME"
          done
          rm -rf "$RUNNER_TEMP/keys"
          ls -la "$OUT" || true
          if [ -n "$FAILED" ]; then echo "Не собрались:$FAILED"; exit 1; fi

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: out/*.apk
          if-no-files-found: warn
